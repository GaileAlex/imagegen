spring:
  application:
    name: imagegen
  threads:
    virtual:
      enabled: true
  ###########################################
  ## MULTIPART (MultipartProperties)
  ###########################################
  # A photo for an edit or a video start frame (contract: at most 20 MB) plus its mask
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 45MB

server:
  port: 8390

###########################################
## MONITORING (project observability)
###########################################
# Actuator has its own port, not published: Prometheus scrapes http://cv-imagegen-app:8081/actuator/prometheus
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: imagegen
  tracing:
    sampling:
      probability: 1.0

imagegen:
  comfyui-url: ${COMFYUI_URL:http://cv-comfyui:8188}
  # The volume imagegen-results
  data-dir: /data
  # The volume imagegen-comfy-io: input/ and output/ of ComfyUI (see ComfyFiles); empty = not shared
  comfyui-io-dir: /comfy-io
  idle-unload: 30m
  # The page sends a heartbeat every 60 s
  presence-timeout: 150s
  retention: 10d
  # A job that runs but stays silent this long has hung: ComfyUI reports every step of a sampler. A slow job goes on:
  # LTX 12 s with keepFace once spilled out of the VRAM and took over 15 min at ~50 W (2026-10-28)
  stall-timeout: 10m
  # A guard over all of one run, however lively
  job-timeout: 60m
  # Russian prompts go to the models in English. The CPU instance of Ollama of the CV project: the GPU belongs to
  # ComfyUI; the model leaves memory with the unload of the GPU model
  translator:
    url: ${TRANSLATOR_URL:http://cv-ollama-cpu:11434}
    model: huihui_ai/gemma-4-abliterated:e4b
    timeout: 3m
  # The prompts of a video written from a short idea (POST /api/prompt-ideas): an uncensored model that sees
  # pictures, pulled into both Ollama instances. The GPU one (7-17 s) while no job runs or waits, the model of the
  # last job is unloaded for it and the next job sends it away; the CPU one (25-50 s) while a job has the GPU.
  # 26b (MoE, 4B active, ~14 GB on the GPU) instead of e4b (4.5 GB, twice as fast): e4b invented people in a photo
  # of an empty room and softened explicit ideas, 26b keeps to the picture (test 2026-10-28)
  idea:
    gpu-url: ${IDEA_GPU_URL:http://cv-ollama:11434}
    url: ${TRANSLATOR_URL:http://cv-ollama-cpu:11434}
    model: huihui_ai/gemma-4-abliterated:26b
    # the storyboard of a 30 s video is ~1500 tokens: ~3 min at 9.6 tok/s when the CPU has to write it
    timeout: 8m
    # it takes most of the card: no longer than a second variant needs
    gpu-keep-alive: 3m
    keep-alive: 15m
    temperature: 0.9
  # The modes of docs/CONTRACT.md. Defaults of the params come from workflows/<id>.params.json unless stated here;
  # the other params of that file (filenamePrefix, sampler, halfWidth ...) are set by the service
  models:
    - id: muse-txt2img
      kind: IMAGE
      title: Muse 4 (Krea 2)
      description: Best for people. Keeps the age and the details of the prompt, natural poses, correct hands; uncensored. The slowest one; 8-20 steps, CFG 1-2.5 (above 3 the image breaks).
      typical-seconds: 50
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: negativePrompt, type: TEXT, default: '' }
        - { name: steps, type: INT, min: 8, max: 40 }
        - { name: cfg, type: FLOAT, min: 1.0, max: 4.0, step: 0.1 }
        - { name: width, type: INT, min: 512, max: 2048, step: 16 }
        - { name: height, type: INT, min: 512, max: 2048, step: 16 }
        - { name: seed, type: SEED }
    - id: krea2-realism-txt2img
      kind: IMAGE
      title: Krea2 Realism (fast)
      description: Fast. Landscapes, streets, signs with text, food, animals as good as Muse, five times quicker; people come out younger than asked; uncensored.
      typical-seconds: 12
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: steps, type: INT, min: 4, max: 16 }
        - { name: width, type: INT, min: 512, max: 2048, step: 16 }
        - { name: height, type: INT, min: 512, max: 2048, step: 16 }
        - { name: seed, type: SEED }
    - id: cyberrealistic-txt2img
      kind: IMAGE
      title: CyberRealistic (Z-Image)
      description: A real photo look. The most natural skin, candid "phone photo" scenes, lively city streets and animals; follows the prompt more loosely, poses are sometimes odd; uncensored.
      typical-seconds: 15
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: steps, type: INT, min: 6, max: 16 }
        - { name: width, type: INT, min: 512, max: 2048, step: 16 }
        - { name: height, type: INT, min: 512, max: 2048, step: 16 }
        - { name: seed, type: SEED }
    - id: moody-txt2img
      kind: IMAGE
      title: Moody (Krea 2)
      description: Young faces, often with an Asian look, soft glamour light; fast. Makes people younger than asked; uncensored.
      typical-seconds: 15
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: steps, type: INT, min: 6, max: 16 }
        - { name: width, type: INT, min: 512, max: 2048, step: 16 }
        - { name: height, type: INT, min: 512, max: 2048, step: 16 }
        - { name: seed, type: SEED }
    - id: muse-edit
      kind: EDIT
      title: Muse edit by instruction
      description: Edits an uploaded photo by a plain instruction ("add a ginger cat on the bed", "remove the pillow"). The whole picture is re-rendered, very close to the photo.
      typical-seconds: 60
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: steps, type: INT, min: 8, max: 40 }
        - { name: cfg, type: FLOAT, min: 1.0, max: 4.0, step: 0.1 }
        - { name: seed, type: SEED }
    - id: muse-inpaint
      kind: INPAINT
      title: Muse inpaint
      description: Redraws only the masked area of an uploaded photo; the pixels outside the mask stay as they were.
      typical-seconds: 60
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: steps, type: INT, min: 8, max: 40 }
        - { name: cfg, type: FLOAT, min: 1.0, max: 4.0, step: 0.1 }
        - { name: seed, type: SEED }
    - id: wan22-i2v-fastmove
      kind: VIDEO
      title: Wan 2.2 Fast Move
      description: Video from a start image, lively motion, no sound; the face of a real person may drift (Wan 2.2 keeps it better). 832x480 (16 fps).
      typical-seconds: 160
      prompt-style: WAN
      clip-seconds: 6
      scene-seconds: 5
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: negativePrompt, type: TEXT }
        # a chain of Wan scenes blurs and shifts its colours from ~17 s on (test 2026-10-29); LTX holds 30 s
        - { name: seconds, type: INT, default: '5', min: 2, max: 20 }
        - { name: orientation, type: ENUM, default: landscape, options: [ landscape, portrait ] }
        - { name: keepFace, type: BOOL, default: 'false' }
        - { name: seed, type: SEED }
    - id: wan22-i2v
      kind: VIDEO
      title: Wan 2.2
      description: Video from a start image that keeps the face of a real person best; calmer motion than Fast Move, no sound. 832x480 (16 fps).
      typical-seconds: 145
      prompt-style: WAN
      clip-seconds: 6
      scene-seconds: 5
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: negativePrompt, type: TEXT }
        - { name: seconds, type: INT, default: '5', min: 2, max: 20 }
        - { name: orientation, type: ENUM, default: landscape, options: [ landscape, portrait ] }
        - { name: keepFace, type: BOOL, default: 'false' }
        - { name: seed, type: SEED }
    - id: ltx25-i2v
      kind: VIDEO
      title: LTX 2.5
      description: Video with sound from a text, or from a start image when one is given. 1216x704 (24 fps).
      typical-seconds: 115
      prompt-style: LTX
      clip-seconds: 12
      # 10 s plus the 17 frames it starts from stay below a plain 12 s clip in the VRAM
      scene-seconds: 10
      image-optional: true
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: negativePrompt, type: TEXT }
        - { name: seconds, type: INT, default: '5', min: 2, max: 30 }
        - { name: orientation, type: ENUM, default: landscape, options: [ landscape, portrait ] }
        - { name: keepFace, type: BOOL, default: 'false' }
        - { name: seed, type: SEED }
    - id: ltx25-nsfw-i2v
      kind: VIDEO
      title: LTX 2.5 NSFW
      description: LTX 2.5 with NSFW fine-tunes merged in, for nude and explicit scenes (the plain LTX blurs and dodges them). Sound, 1216x704 (24 fps); from a text or a start image.
      typical-seconds: 150
      prompt-style: LTX
      clip-seconds: 12
      # 10 s plus the 17 frames it starts from stay below a plain 12 s clip in the VRAM
      scene-seconds: 10
      image-optional: true
      params:
        - { name: prompt, type: TEXT, required: true }
        - { name: negativePrompt, type: TEXT }
        - { name: seconds, type: INT, default: '5', min: 2, max: 30 }
        - { name: orientation, type: ENUM, default: landscape, options: [ landscape, portrait ] }
        - { name: keepFace, type: BOOL, default: 'false' }
        - { name: seed, type: SEED }
