services:

  spring-app:
    container_name: cv-imagegen-app
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8390:8390"
    volumes:
      # Job records, inputs and results (10 days)
      - results:/data
      # The input and output folders of ComfyUI: the photos and results are deleted there once fetched
      - comfy-io:/comfy-io
    environment:
      TZ: Europe/Tallinn
      COMFYUI_URL: ${COMFYUI_URL:-http://cv-comfyui:8188}
    networks:
      - kokoro-net

  comfyui:
    container_name: cv-comfyui
    build: ./comfyui-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - models:/models
      # Uploaded photos and results, deleted by cv-imagegen-app once it has them
      - comfy-io:/io
      # CUDA compiles its kernels for the GPU on the first run; keep them across container re-creation
      - cuda-cache:/home/comfy/.nv
    environment:
      TZ: Europe/Tallinn
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        limits:
          cpus: '10.0'
          memory: 48G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - kokoro-net

volumes:
  results:
    name: imagegen-results
  comfy-io:
    name: imagegen-comfy-io
  models:
    # Created by hand and filled from StabilityMatrix\Models; never "docker compose down -v"
    name: imagegen-models
    external: true
  cuda-cache:

networks:
  kokoro-net:
    external: true
