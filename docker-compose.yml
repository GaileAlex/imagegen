services:

  comfyui:
    container_name: cv-comfyui
    build: ./comfyui-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - models:/models
      # CUDA compiles its kernels for the GPU on the first run; keep them across container re-creation
      - cuda-cache:/home/comfy/.nv
    environment:
      TZ: Europe/Tallinn
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        limits:
          cpus: '10.0'
          memory: 48G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - kokoro-net

volumes:
  models:
    # Created by hand and filled from StabilityMatrix\Models; never "docker compose down -v"
    name: imagegen-models
    external: true
  cuda-cache:

networks:
  kokoro-net:
    external: true
